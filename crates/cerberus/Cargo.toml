[package]
name = "cerberus"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["ahokinson <1762048+ahokinson@users.noreply.github.com>"]
description = "A three-headed guard for Claude Code's Bash tool: risk scanning, policy evaluation, and scripted situational checks, run as a PreToolUse hook."
repository = "https://github.com/ahokinson/cerberus"
homepage = "https://github.com/ahokinson/cerberus"
readme = "../../README.md"
keywords = ["claude-code", "hook", "security", "guardrails", "agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.5", features = ["derive", "wrap_help"] }
rhai = { version = "1.25.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_norway = "0.9.42"
tokio = { version = "1.53.1", features = ["rt", "time"] }
toml = "1.1.4"
turso = { version = "0.8.0-pre.8", default-features = false, features = ["mimalloc"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)", "cfg(coverage)"] }

[dev-dependencies]
# A pseudo-terminal for the tests that drive `cerberus trust`, which refuses
# without one. Already in the tree through another crate; this only turns on
# its `pty` feature.
rustix = { version = "1.1.4", features = ["fs", "pty"] }
