[package]
name = "cerberus"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["ahokinson <1762048+ahokinson@users.noreply.github.com>"]
description = "A three-headed guard for Claude Code's Bash tool: risk scanning, policy evaluation, and scripted situational checks, run as a PreToolUse hook."
repository = "https://github.com/ahokinson/cerberus"
homepage = "https://github.com/ahokinson/cerberus"
readme = "../../README.md"
keywords = ["claude-code", "hook", "security", "guardrails", "agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.5", features = ["derive", "wrap_help"] }
rhai = { version = "1.25.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_norway = "0.9.42"
tokio = { version = "1.53.1", features = ["rt", "time"] }
toml = "1.1.4"
turso = "0.8.0-pre.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)", "cfg(coverage)"] }
